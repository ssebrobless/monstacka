name: monstacka-desktop

on:
  push:
    branches:
      - main
      - codex/phase1-launcher-flow
    tags:
      - 'monstacka-v*'
    paths:
      - '.github/workflows/monstacka-desktop.yml'
      - 'README.md'
      - 'Launcher.ps1'
      - 'Start-Tetris.cmd'
      - 'Start-Tetris.command'
      - 'enhanced/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MonStacka! macOS (Apple Silicon)
            platform: macos-latest
            args: '--target aarch64-apple-darwin'
            rustTarget: 'aarch64-apple-darwin'
            artifactSuffix: 'macos-arm64'
          - name: MonStacka! macOS (Intel)
            platform: macos-latest
            args: '--target x86_64-apple-darwin'
            rustTarget: 'x86_64-apple-darwin'
            artifactSuffix: 'macos-x64'
          - name: MonStacka! Windows
            platform: windows-latest
            args: ''
            rustTarget: ''
            artifactSuffix: 'windows-x64'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: enhanced/package-lock.json

      - name: Install Rust stable with target
        if: ${{ matrix.rustTarget != '' }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTarget }}

      - name: Install Rust stable
        if: ${{ matrix.rustTarget == '' }}
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        working-directory: enhanced
        run: npm ci

      - name: Build workflow artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: enhanced
          args: ${{ matrix.args }}
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: 'monstacka-__VERSION__-${{ matrix.artifactSuffix }}'

      - name: Build and publish tagged release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: enhanced
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: 'MonStacka! ${{ github.ref_name }}'
          releaseBody: 'Standalone desktop downloads for MonStacka! on macOS and Windows.'
          releaseDraft: false
          prerelease: false
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: 'monstacka-__VERSION__-${{ matrix.artifactSuffix }}'
